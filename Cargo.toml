[package]
name = "mistermanager"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
calamine = { version = "0.36", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
jluszcz_finance_utils = { git = "https://github.com/jluszcz/finance-utils", features = ["backup", "money", "report", "scratch", "tui"] }
jluszcz_rust_utils = { git = "https://github.com/jluszcz/rust-utils", features = ["query"] }
quick-xml = "0.41"
ratatui = "0.30"
# `jluszcz_rust_utils::query` builds and returns the client; this crate only
# ever names request/response types, and this declaration turns on no TLS or
# transport feature. That is a fact about the declaration and not about the
# build: features unify across the whole graph, rust-utils takes reqwest with
# its defaults on, and reqwest resolves default -> default-tls -> rustls ->
# __rustls-aws-lc-rs. So aws-lc-sys is an ordinary dependency of this crate
# (`cargo tree -i aws-lc-sys` walks it back through rustls and reqwest), which
# is a second rustls crypto backend beside the ring that `finance-utils`'
# `backup` feature chooses for aws-sdk-s3, and the C it compiles. Nothing
# written on this line can drop it -- the reqwest declaration that decides it
# is rust-utils', and the change belongs in that repository. What it buys
# is build weight and coherence rather than a build that works, which this
# one does on every target CI builds.
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "net", "time"] }

[dev-dependencies]
toml = "1.1"

[features]
# Demo mode: `mm --demo`, and the obfuscation behind it. Off by default so a
# shipped binary carries neither the flag nor the code it installs.
demo = []
# The workbook importer: `mm import`, `src/import/`, and `calamine` under it.
# Off by default for the reason `demo` is -- the workbook is a migration the
# owner runs once per edit of it, not something the application needs to open
# a database -- and `calamine` is the only dependency a build without it drops
# entirely. The workbook-oracle tests in `tests/` compile to nothing without
# it, so CI's all-features job is what runs them.
import = ["dep:calamine"]

[[bin]]
name = "mm"
path = "src/bin/mm.rs"
