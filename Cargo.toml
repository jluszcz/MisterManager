[package]
name = "mistermanager"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
calamine = "0.36"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2.0"

[[bin]]
name = "mm"
path = "src/bin/mm.rs"
